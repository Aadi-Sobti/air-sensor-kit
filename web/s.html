<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProseFire sensor</title>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <section id="reading" hidden>
        <p class="hint" data-i18n="sensor.aqi"></p>
        <p id="aqi-box" class="aqi-box"><span id="aqi"></span> <span id="aqi-cat"></span></p>
        <p id="pm"></p>
        <p class="hint" id="nowcast-note"></p>
      </section>
      <p id="status"></p>
      <div class="chart-tabs" id="tabs" hidden>
        <button type="button" class="tab" id="t24" data-i18n="my.chart24"></button>
        <button type="button" class="tab" id="t7d" data-i18n="my.chart7d"></button>
      </div>
      <div id="chart"></div>
      <p id="indoor" class="hint" hidden data-i18n="sensor.indoor"></p>
      <p id="unplaced" class="hint" hidden data-i18n="sensor.unplaced"></p>
      <div id="error" class="error" role="alert" hidden></div>
      <p><a href="/" data-i18n="sensor.backToMap"></a></p>
    </main>
    <footer>
      <p data-i18n="safety.notSmokeAlarm">This is not a smoke alarm. It does not replace official warnings or evacuation orders.</p>
    </footer>
    <script type="module" src="/src/sensor.ts"></script>
  </body>
</html>
