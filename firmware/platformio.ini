; ProseFire firmware (ESP8266 NodeMCU V3 + PMS5003)
; Pinned versions: change only on purpose, and re-run all checks after a change.

[platformio]
default_envs = release

[esp8266_common]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
; CH340 clones dislike 921600 (115200 is the reliable speed)
upload_speed = 115200
monitor_speed = 115200
; 4 MB flash: ~1 MB sketch (room for OTA), 1 MB LittleFS for identity/config
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
build_flags =
    -Wall
lib_deps =

; Release build: what ships in kits. Must never contain DEV_ flags, setInsecure, or http://
; (enforced by tools/check_release.py in CI). Dev-only code lives in src/dev/ and is excluded here.
[env:release]
extends = esp8266_common
build_src_filter = +<*> -<dev/>
build_flags =
    ${esp8266_common.build_flags}
    -DFW_ENV=\"release\"

; Dev build: verbose logs, local-emulator HTTP (from M4). See dev-fake for the fake sensor.
[env:dev]
extends = esp8266_common
build_src_filter = +<*>
build_flags =
    ${esp8266_common.build_flags}
    -DFW_ENV=\"dev\"
    -DDEV_BUILD=1
    -DDEV_VERBOSE_LOGS=1

; Dev build with a fake PMS5003 (no sensor needed): synthesizes frames, smoke spikes, bad checksums.
[env:dev-fake]
extends = env:dev
build_flags =
    ${env:dev.build_flags}
    -DDEV_FAKE_PMS=1

; Host unit tests for the plain C++ logic in lib/core (no Arduino).
[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall
